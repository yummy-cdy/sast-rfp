<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로젝트 목록 - SAST 프로그램</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div id="nav"></div>
    <div class="max-w-5xl mx-auto bg-white p-6 rounded shadow">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-2xl font-bold">프로젝트 목록</h1>
            <button id="newProjectBtn" class="hidden bg-blue-600 text-white font-bold px-4 py-2 rounded hover:bg-blue-700">
                + 새 프로젝트
            </button>
        </div>

        <div id="newProjectForm" class="hidden mb-6 p-4 border rounded bg-gray-50 space-y-3">
            <div>
                <label class="block text-sm font-semibold mb-1">프로젝트명</label>
                <input type="text" id="projectName" class="w-full border rounded px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">설명</label>
                <input type="text" id="projectDescription" class="w-full border rounded px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">분석 대상 언어</label>
                <select id="targetLanguage" class="w-full border rounded px-3 py-2">
                    <option value="Python">Python</option>
                    <option value="Java">Java</option>
                    <option value="Javascript">Javascript</option>
                </select>
            </div>
            <div class="flex gap-2">
                <button id="createProjectBtn" class="bg-blue-600 text-white font-bold px-4 py-2 rounded hover:bg-blue-700">생성</button>
                <button id="cancelCreateBtn" class="px-4 py-2 rounded border">취소</button>
            </div>
        </div>

        <table class="min-w-full border border-gray-300">
            <thead class="bg-gray-200">
                <tr>
                    <th class="py-2 px-4 border-b text-left">ID</th>
                    <th class="py-2 px-4 border-b text-left">프로젝트명</th>
                    <th class="py-2 px-4 border-b text-left">언어</th>
                    <th class="py-2 px-4 border-b text-left">설명</th>
                    <th class="py-2 px-4 border-b text-left">생성일</th>
                </tr>
            </thead>
            <tbody id="projectTableBody"></tbody>
        </table>
    </div>
    <script src="/static/common.js"></script>
    <script src="/static/projects.js"></script>
</body>
</html>
