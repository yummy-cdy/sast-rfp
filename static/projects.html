<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로젝트 목록 - SAST 프로그램</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="sast-app">
    <div id="nav"></div>
    <main class="sast-main">
      <div class="sast-main-inner">
        <div class="sast-page-header">
          <div>
            <h1 class="sast-page-title">프로젝트</h1>
            <p class="sast-page-subtitle">접근 권한이 있는 분석 대상 프로젝트 목록입니다.</p>
          </div>
          <button id="newProjectBtn" class="hidden sast-btn sast-btn-primary">+ 새 프로젝트</button>
        </div>

        <div id="newProjectForm" class="hidden sast-card space-y-3">
            <div>
                <label class="sast-label">프로젝트명</label>
                <input type="text" id="projectName" class="sast-input">
            </div>
            <div>
                <label class="sast-label">설명</label>
                <input type="text" id="projectDescription" class="sast-input">
            </div>
            <div>
                <label class="sast-label">분석 대상 언어</label>
                <select id="targetLanguage" class="sast-select">
                    <option value="Python">Python</option>
                    <option value="Java">Java</option>
                    <option value="Javascript">Javascript</option>
                </select>
            </div>
            <div class="flex gap-2 pt-1">
                <button id="createProjectBtn" class="sast-btn sast-btn-primary">생성</button>
                <button id="cancelCreateBtn" class="sast-btn sast-btn-secondary">취소</button>
            </div>
        </div>

        <div class="sast-table-wrap">
        <table class="sast-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>프로젝트명</th>
                    <th>언어</th>
                    <th>설명</th>
                    <th>생성일</th>
                </tr>
            </thead>
            <tbody id="projectTableBody"></tbody>
        </table>
        </div>
      </div>
    </main>
  </div>
  <script src="/static/common.js"></script>
  <script src="/static/projects.js"></script>
</body>
</html>
