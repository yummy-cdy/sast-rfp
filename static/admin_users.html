<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사용자 관리 - SAST 프로그램</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="sast-app">
    <div id="nav"></div>
    <main class="sast-main">
      <div class="sast-main-inner" style="max-width: 760px;">
        <div class="sast-page-header">
          <div>
            <h1 class="sast-page-title">사용자 관리</h1>
            <p class="sast-page-subtitle">계정 생성 및 역할 관리 (시스템 관리자 전용)</p>
          </div>
        </div>

        <div class="sast-card space-y-3">
            <h2 class="sast-card-title">신규 계정 생성</h2>
            <div>
              <label class="sast-label">계정 ID</label>
              <input type="text" id="newUserId" class="sast-input">
            </div>
            <div>
              <label class="sast-label">비밀번호 (8자 이상)</label>
              <input type="password" id="newUserPassword" class="sast-input">
            </div>
            <div>
              <label class="sast-label">역할</label>
              <select id="newUserRole" class="sast-select">
                  <option value="USER">일반 사용자</option>
                  <option value="ADMIN">시스템 관리자</option>
              </select>
            </div>
            <div class="pt-1">
              <button id="createUserBtn" class="sast-btn sast-btn-primary">생성</button>
            </div>
            <div id="createUserMessage" class="text-sm text-red-600"></div>
        </div>

        <div class="sast-table-wrap">
        <table class="sast-table">
            <thead>
                <tr>
                    <th>계정 ID</th>
                    <th>역할</th>
                    <th>활성 상태</th>
                </tr>
            </thead>
            <tbody id="userTableBody"></tbody>
        </table>
        </div>
      </div>
    </main>
  </div>
  <script src="/static/common.js"></script>
  <script src="/static/admin_users.js"></script>
</body>
</html>
